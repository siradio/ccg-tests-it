<style>
  :root{ --navy:#0F2C4C; --navy2:#16365C; --gold:#F4B41A; --gold2:#FFC94A;
         --ink:#1C2A3A; --muted:#6B7A8D; --line:#E3E9F0; --bg:#EEF2F7 }
  *{ box-sizing:border-box; margin:0; padding:0 }
  body{ font-family:'Segoe UI',system-ui,Arial,sans-serif; color:var(--ink);
    background:radial-gradient(120% 90% at 85% -10%, #16365C 0%, #0F2C4C 45%, #0A2033 100%);
    min-height:100vh; display:grid; place-items:center; padding:24px }
  .box{ width:100%; max-width:390px; background:#fff; border-radius:16px;
    box-shadow:0 24px 60px rgba(5,18,32,.45); overflow:hidden }
  .hd{ background:var(--navy); color:#fff; padding:20px 24px; display:flex; align-items:center; gap:13px }
  .hd .lg{ background:#fff; border-radius:9px; padding:5px 7px; display:flex; flex:none }
  .hd .lg img{ height:28px; display:block }
  .hd h1{ font-size:15px; font-weight:800; letter-spacing:.2px; line-height:1.25 }
  .hd .sl{ font-size:10px; color:var(--gold); font-weight:700; letter-spacing:1.4px;
    text-transform:uppercase; margin-top:3px }
  .bd{ padding:22px 24px 24px }
  .f{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px }
  label{ font-size:11.5px; font-weight:700; color:#415066; letter-spacing:.2px }
  input{ font:inherit; font-size:15px; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:9px; background:#Fbfcfe; color:var(--ink); transition:.15s; width:100% }
  input:focus{ outline:none; border-color:var(--gold); background:#fff;
    box-shadow:0 0 0 3px rgba(244,180,26,.18) }
  button{ font:inherit; font-size:14px; font-weight:700; cursor:pointer; border:none;
    border-radius:9px; padding:12px 16px; width:100%; background:var(--navy); color:#fff;
    transition:.15s; margin-top:4px }
  button:hover:not(:disabled){ background:var(--navy2) }
  button:disabled{ opacity:.55; cursor:default }
  .msg{ font-size:12.5px; font-weight:700; margin-top:13px; min-height:17px; text-align:center }
  .msg.ko{ color:#D4202A }
  .msg.wait{ color:var(--muted) }
  .note{ font-size:11px; color:var(--muted); line-height:1.55; margin-top:16px;
    padding-top:14px; border-top:1px dashed var(--line) }
  .vers{ font-size:10px; color:#9AA7B6; text-align:center; margin-top:10px; letter-spacing:.3px }
</style>

    return a;
  }

  async function ouvrir(user, pass) {
    var mat = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(user + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash:'SHA-256' },
      mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var clair = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.ct));

    // Le document d'origine remplace celui-ci : ses scripts s'executent alors
    // normalement. innerHTML ne le permettrait pas.
    var html = new TextDecoder().decode(clair);
    document.open();
    document.write(html);
    document.close();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true;
    dire('Déchiffrement…', 'wait');
    setTimeout(function () {
      ouvrir(u.value.trim(), p.value).catch(function () {
        go.disabled = false;
        dire('Identifiant ou mot de passe incorrect.', 'ko');
        p.value = ''; p.focus();
      });
    }, 30);
  });

  u.focus();
}());
</script>
