<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests de recrutement IT</title>
<style>
  :root{ --vert:#176338; --vert2:#1d7a45; --vert3:#198b4b;
         --ink:#20332a; --muted:#5c6f63; --line:#d9e4dc }
  *{ box-sizing:border-box; margin:0; padding:0 }
  body{ font-family:Arial,Helvetica,sans-serif; color:var(--ink);
    background:radial-gradient(120% 90% at 85% -10%, #1d7a45 0%, #176338 45%, #0d3f23 100%);
    min-height:100vh; display:grid; place-items:center; padding:24px }
  .box{ width:100%; max-width:400px; background:#fff; border-radius:16px;
    box-shadow:0 24px 60px rgba(4,30,16,.45); overflow:hidden }
  .hd{ background:var(--vert); color:#fff; padding:22px 24px }
  .hd .k{ font-size:11px; font-weight:bold; letter-spacing:1.4px; opacity:.85 }
  .hd h1{ font-size:19px; margin-top:6px; line-height:1.25 }
  .bd{ padding:22px 24px 24px }
  .f{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px }
  label{ font-size:12px; font-weight:bold; color:#41554a }
  input{ font:inherit; font-size:15px; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:9px; background:#fbfdfb; color:var(--ink); width:100% }
  input:focus{ outline:none; border-color:var(--vert3); background:#fff;
    box-shadow:0 0 0 3px rgba(25,139,75,.16) }
  button{ font:bold 15px Arial; cursor:pointer; border:0; border-radius:9px;
    padding:12px 16px; width:100%; background:var(--vert); color:#fff; margin-top:4px }
  button:hover:not(:disabled){ background:var(--vert2) }
  button:disabled{ opacity:.55; cursor:default }
  .msg{ font-size:12.5px; font-weight:bold; margin-top:13px; min-height:17px; text-align:center }
  .msg.ko{ color:#c0392b } .msg.wait{ color:var(--muted) }
  .note{ font-size:11px; color:var(--muted); line-height:1.55; margin-top:16px;
    padding-top:14px; border-top:1px dashed var(--line) }
  .vers{ font-size:10px; color:#9aa7a0; text-align:center; margin-top:10px }
</style>
</head>
<body>

  </div>
  <div class="bd">
    <div class="f">
      <label for="u">Identifiant</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="off"

    <div class="f">
      <label for="p">Mot de passe</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>

      PBKDF2-SHA256 (310 000 it&eacute;rations).</p>

  </div>
</form>

  var form = document.getElementById('form');
  var u = document.getElementById('u'), p = document.getElementById('p');
  var go = document.getElementById('go'), msg = document.getElementById('msg');

  function dire(t, c) { msg.textContent = t; msg.className = 'msg ' + (c || ''); }

  if (!window.crypto || !window.crypto.subtle) {
    go.disabled = true;
    dire("D\u00e9chiffrement indisponible : ouvrez la page en https.", 'ko');
    return;
  }

  function bytes(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) { a[i] = b.charCodeAt(i); }
    return a;
  }

  async function ouvrir(user, pass) {
    // Une seule derivation, partagee par tous les blocs : le sel est commun,
    // seul le couple identifiant + mot de passe distingue les cles.
    var mat = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(user + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
      mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    for (var i = 0; i < BLOCS.length; i++) {
      try {
        var clair = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: bytes(BLOCS[i].iv) }, key, bytes(BLOCS[i].ct));
        var html = new TextDecoder().decode(clair);
        document.open();
        document.write(html);
        document.close();
        return;
      } catch (e) { /* bloc suivant */ }
    }
    throw new Error('aucun acc\u00e8s');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true;
    dire('D\u00e9chiffrement\u2026', 'wait');
    setTimeout(function () {
      ouvrir(u.value.trim().toLowerCase(), p.value).catch(function () {
        go.disabled = false;
        dire('Identifiant ou mot de passe incorrect.', 'ko');
        p.value = ''; p.focus();
      });
    }, 30);
  });

  u.focus();
}());
